# 批次 P0｜模型基座：把 18 个自建 provider / 75 个模型 写回 profile 的 llm-pi-ai 行。
# 由 _tmp/export-providers-patch.mjs 从 ~/.dsh/settings.yaml.imported 程序化导出，逐字保留，无手抄。
# 不含任何 API Key 值 —— 各单位通过 apiKeyEnv 指向 .credentials.yaml 里的键名。
# 应用方式：作为 profile 的 cordis.patch.yml 追加（或合并进该数组），然后重载/重启应用。
- id: llm-pi-ai
  config:
    providers:
      tokenry:
        displayName: tokenry (tokenrhythm new key)
        apiKeyEnv: TOKENRY_API_KEY
        api: openai-completions
        baseURL: https://tokenrhythm.studio/v1
        models:
          - id: deepseek-flash
            input:
              - text
              - image
            contextWindow: 1000000
        compat:
          supportsDeveloperRole: false
      opencode-go:
        apiKeyEnv: OPENCODE_GO_API_KEY
        baseURL: https://opencode.ai/zen/go/v1
        models:
          - id: deepseek-v4-flash
            name: DeepSeek V4 Flash
            contextWindow: 1000000
            maxTokens: 384000
          - id: deepseek-v4-pro
            name: DeepSeek V4 Pro
            contextWindow: 1000000
            maxTokens: 384000
          - id: glm-5.2
            name: GLM-5.2
            contextWindow: 1000000
            maxTokens: 131072
          - id: kimi-k3
            name: Kimi K3 (2x usage)
            contextWindow: 1048576
            maxTokens: 131072
        api: openai-completions
        compat:
          supportsDeveloperRole: false
      sennsenova:
        displayName: SenseNova
        apiKeyEnv: SENNSENOVA_API_KEY
        api: openai-completions
        baseURL: https://token.sensenova.cn/v1/
        retryPolicy:
          mode: normal
          maxRetries: 6
          retryableCodes:
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
          backoff:
            initialDelayMs: 5000
            maxDelayMs: 65000
            jitterRatio: 0.2
        models:
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
            contextWindow: 1048576
            compat:
              supportsDeveloperRole: false
          - id: deepseek-v4-pro
            name: deepseek-v4-pro
            contextWindow: 1048576
            compat:
              supportsDeveloperRole: false
          - id: kimi-k3
