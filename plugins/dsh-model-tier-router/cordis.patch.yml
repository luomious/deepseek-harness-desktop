# dsh-model-tier-router — 同源模型自动分级路由
# 同一 provider 下配置高/低两个模型；简单任务走 low，复杂任务走 high。
# 注：运行时 dev_inject_plugin 注入时 config={}，会使用代码内 DEFAULTS；
#     重启后（bundles 装配）由本文件的 config 接管并覆盖 DEFAULTS。
- insert:
    - id: dsh-model-tier-router
      name: '@dsh-external/dsh-model-tier-router'
      config:
        enabled: true
        # 只对子 agent（后台委派）自动切换；主对话里用户已选模型绝不动。
        subagentOnly: true
        # bidirectional: 高低双向切换；downgrade: 只降级不升级；upgrade: 只升级不降级
        direction: bidirectional
        # 分类不明确（无关键词且长度不足）时用哪个：high 保守 / low 省钱
        ambiguous: high
        # 任务文本长度 >= 该值时判定为复杂任务
        minComplexLength: 140
        # 同源高/低模型映射（provider 必须与模型选择器里显示的一致）
        # 2026-08-23 修复：模型 id 已变更（deepseek-v4-flash → deepseek-v4-flash-0731），
        # 旧路由 id 不匹配导致自动切换从未触发——已按实际模型修正。
        # 2026-09-04：qwen3.8-max 已声明原生多模态（settings.yaml input:[text,image]），
        # modlens 不再为其生成 (modlens vision) 双胞胎 → 移除该包装路由；
        # 高规格文本任务由 deepseek-v4-pro-0813 路由承接。
        routes:
          - provider: modlens-tokenrhythm01
            high: deepseek-v4-pro-0813
            low: deepseek-v4-flash-0731
          - provider: modlens-xiaomi-token-plan-cn
            high: mimo-v2.5-pro
            low: deepseek-v4-flash
