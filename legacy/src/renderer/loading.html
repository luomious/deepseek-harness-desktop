<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek Harness</title>
  <style>
    /* 配色与官方 dsw alias token 对齐（canvas/ink/muted/accent），
       字体栈含 CJK 回退，避免中文回退到宋体 */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #151517;               /* --color-canvas (bluish-950) */
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    .container {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #adb2b8;                    /* --color-muted (bluish-400) */
    }
    .logo {
      width: 80px; height: 80px;
      margin-bottom: 24px;
      border-radius: 18px;
      background: linear-gradient(135deg, #4d6bfe 0%, #7b5fff 100%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(77, 107, 254, 0.4);
      animation: pulse 2s ease-in-out infinite;
    }
    .logo svg { width: 44px; height: 44px; fill: white; }
    .title {
      font-size: 22px; font-weight: 600;
      margin-bottom: 8px;
      color: #f9fafb;                    /* --color-ink (bluish-50) */
    }
    .subtitle {
      font-size: 14px; color: #adb2b8;
      margin-bottom: 32px;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(103, 158, 254, 0.25);
      border-top-color: #679efe;         /* --accent (deepseek-400) */
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .status {
      margin-top: 16px;
      font-size: 13px; color: #81858c;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2zm0 2.236L19.764 7 12 9.764 4.236 7 12 4.236zM4 8.618l7 2.647v7.764l-7-3.5V8.618zm9 10.411v-7.764l7-2.647v6.911l-7 3.5z"/>
      </svg>
    </div>
    <div class="title">DeepSeek Harness</div>
    <div class="subtitle">正在启动本地 Agent 服务...</div>
    <div class="spinner"></div>
    <div class="status" id="status">初始化中</div>
  </div>
  <script>
    // 加载状态更新
    let dots = 0;
    const statusEl = document.getElementById('status');
    setInterval(() => {
      dots = (dots + 1) % 4;
      statusEl.textContent = '初始化中' + '.'.repeat(dots);
    }, 500);
  </script>
</body>
</html>
