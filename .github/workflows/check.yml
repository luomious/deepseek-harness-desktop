name: Check

# Why windows-latest: the product is a Windows-only Electron app, and its scripts
# and patches exercise NTFS junctions and recycle-bin semantics, so a Windows
# runner is the faithful environment. Public repo, so windows-latest is free.
#
# Correction, verified 2026-09-11: the job was NOT red because of ubuntu. Replaying
# the same commands against a clean checkout on Windows reproduces the exact same
# 5 failures (tests 55 / pass 50 / fail 5). The red badge came from tests whose
# subject needs assets that are not in the repository (an npm dep, a gitignored
# external repo, local runtime state) -- a red badge nobody reads is worse than no
# badge, so those tests are excluded and announced in the Unit tests step below.
#
# Scope note: this job stays dependency-free (no npm install) and mirrors the
# dependency-free steps of scripts/check-all.ps1. A runner only sees COMMITTED
# files, so anything needing local-only assets is out of scope here and stays
# covered by scripts/check-all.ps1 on a workstation. Gates that need the built app
# (verify-patches, startup smoke) deliberately stay local-only.

on: [push, pull_request, workflow_dispatch]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check - plugin and patch JS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $roots = @('plugins', 'patches/bundles', 'dsh-context-lifecycle', 'dsh-stuck-loop-guard', 'dsh-vision-rotator')
          $files = @()
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            $files += @(Get-ChildItem $r -Recurse -Filter *.js -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\node_modules\\' })
          }
          $files = @($files | Where-Object { $_.FullName -match '\\lib\\' -or $_.FullName -match '\\patches\\bundles\\' })
          $bad = @()
          foreach ($f in $files) {
            & node --check $f.FullName 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $bad += $f.FullName }
          }
          Write-Host ('checked ' + $files.Count + ' JS files, ' + $bad.Count + ' syntax errors')
          if ($bad.Count -gt 0) { $bad | ForEach-Object { Write-Host ('  FAIL ' + $_) }; exit 1 }

      - name: Plugin import gate
        shell: pwsh
        run: |
          node scripts/verify-plugin-imports.mjs
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Unit tests - tests/plugins + plugin-internal
        shell: pwsh
        run: |
          # A runner checkout only contains COMMITTED files, so tests whose subject
          # needs local-only assets are out of scope here; scripts/check-all.ps1
          # covers them on a full workstation. Exclusions are always announced
          # (repo rule: scope exclusions must never be silent):
          #   profile-guard        needs the app npm dep @electron/asar
          #   routing-suite-smoke  subject lives in the external dsh-routing-suite
          #                        repo (.gitignore:54) - never in a checkout
          #   safe-delete-shim     2 assertions depend on local runtime state
          #                        (SELF-2 quarantine dir, isProtected homedir/tmpdir)
          # Files are globbed rather than listed, so committing new tests widens
          # coverage automatically.
          $exclude = @('profile-guard.test.mjs', 'routing-suite-smoke.test.mjs', 'safe-delete-shim.test.mjs')
          $ErrorActionPreference = 'Continue'
          $t1 = @(Get-ChildItem tests/plugins -Filter '*.test.mjs' -ErrorAction SilentlyContinue)
          $t2 = @(Get-ChildItem plugins -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ChildItem (Join-Path $_.FullName 'tests') -Filter '*.test.mjs' -ErrorAction SilentlyContinue })
          $all = @(@($t1) + @($t2)) | Where-Object { $exclude -notcontains $_.Name }
          Write-Host ('files: tests/plugins=' + $t1.Count + '  plugins/*/tests=' + $t2.Count + '  running=' + $all.Count + '  excluded=' + $exclude.Count)
          Write-Host ('excluded: ' + ($exclude -join ', '))
          if ($all.Count -eq 0) { Write-Host 'SKIP no test files found'; exit 0 }
          node --test ($all | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { exit 1 }
